<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">FlowForge</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2B50"/>
      <stop offset="1" stop-color="#111B33"/>
    </linearGradient>
    <clipPath id="pool"><rect x="44" y="80" width="424" height="352" rx="32"/></clipPath>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- pool with three swimlanes -->
  <g clip-path="url(#pool)">
    <rect x="44" y="80" width="424" height="117" fill="#21366A"/>
    <rect x="44" y="197" width="424" height="118" fill="#1B2D59"/>
    <rect x="44" y="315" width="424" height="117" fill="#21366A"/>
    <rect x="44" y="80" width="48" height="352" fill="#2C4482"/>
  </g>
  <g stroke="#3A5AA0" stroke-width="5">
    <line x1="44" y1="197" x2="468" y2="197"/>
    <line x1="44" y1="315" x2="468" y2="315"/>
    <line x1="92" y1="80" x2="92" y2="432"/>
  </g>
  <rect x="44" y="80" width="424" height="352" rx="32" fill="none" stroke="#3A5AA0" stroke-width="7"/>

  <!-- flow: start -> gateway -> crafted agent -->
  <g fill="none" stroke="#5EEAD4" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <path d="M194 138 H256 V204"/>
    <path d="M308 256 H372 V318"/>
  </g>
  <!-- start event -->
  <circle cx="160" cy="138" r="30" fill="#111B33" stroke="#5EEAD4" stroke-width="16"/>
  <!-- gateway -->
  <path d="M256 206 L306 256 L256 306 L206 256 Z" fill="#111B33" stroke="#FBBF24" stroke-width="16" stroke-linejoin="round"/>
  <!-- crafted agent: tile with spark -->
  <rect x="324" y="328" width="96" height="92" rx="24" fill="#FBBF24"/>
  <path d="M372 344 C375 364 381 370 402 374 C381 378 375 384 372 404 C369 384 363 378 342 374 C363 370 369 364 372 344 Z" fill="#111B33"/>
</svg>
