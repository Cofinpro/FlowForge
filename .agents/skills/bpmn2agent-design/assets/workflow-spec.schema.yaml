# workflow-spec.schema.yaml
#
# JSON Schema (draft-07) for generated/<workflow>/workflow-spec.yaml — the single source of truth
# produced by bpmn2agent-analyze / -knowledge / -design and consumed by bpmn2agent-generate / -verify.
# Keyed by BPMN element ID throughout, so re-running the pipeline against a changed .bpmn can diff
# element-by-element and only ask about what's new or changed. The author's .bpmn is never mutated.
#
# Correspondence to the dark-factory `sdlc:` extension this vocabulary is derived from
# (docs/planning/dark-factory-prozess-gedaechtnis.md §3) — kept generic, not dark-factory-specific:
#
#   sdlc:step               -> elements.<id>.{bpmnType,label,lane,kind}
#                               (agentRole -> lane; modelRole/kind/skill collapse into `kind` once a
#                               concrete generation decision is made — kind: skill implies an
#                               llm-producer step, kind: script a deterministic one)
#   sdlc:input               -> elements.<id>.inputs[]   (artifact/required/cardinality)
#   sdlc:output               -> elements.<id>.outputs[]  (artifact/itemPrefix/cardinality)
#   sdlc:research             -> elements.<id>.knowledge[] (tool/purpose/ref generalised to a
#                               notebook id from knowledge.notebooks, or the literal "websearch")
#   sdlc:panel                -> out of scope for v1 (dark-factory-specific synthetic-user construct);
#                               a workflow needing an equivalent step models it as an ordinary
#                               serviceTask and gets a normal kind: skill|agent-checklist entry
#   sdlc:critic                -> elements.<id>.gate (when the gate sits on a task, not a gateway)
#   sdlc:gate                  -> elements.<id>.gate.{kind,criteria,maxLoops}
#                               (kind generalises critic|phase-panel|deterministic to
#                               critic|human|deterministic|panel)
#   sdlc:condition              -> elements.<id>.condition
#   sdlc:collection             -> elements.<id>.collection
#   sdlc:bundle                 -> artifacts.<id>.bundledIn (informational, not a separate section)
#
# Beyond the sdlc: vocabulary, two optional top-level sections carry context the diagram draws as
# data stores and process-wide input/output (plan: docs/plans/kontextquellen/plan.md):
#
#   dataStoreReference        -> contextSources.<id> (+ elements.<storeRefId>.kind: context-source)
#   ioSpecification dataInput/dataOutput (or the "no producer" / "no reader" data-object
#                               convention) -> workflowIO.{input,output}
#                               (+ elements.<id>.kind: workflow-input | workflow-output)
#
$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://ai-sdlc.internal/schemas/bpmn2agent/workflow-spec.schema.yaml"
title: workflow-spec
description: >
  Sidecar decision store for one bpmn2agent-design run. Everything the BPMN cannot express — the
  chosen generation kind per element, generated file paths, role/model/tool assignment, the
  orchestration pattern and its rationale, knowledge sources, and unresolved questions — lives here,
  keyed by BPMN element ID. Mapping report, mapped BPMN copy and HTML viewer are all generated FROM
  this file, never the other way round.
type: object
required: [meta, elements]
additionalProperties: false

properties:
  meta:
    $ref: "#/definitions/meta"
  roles:
    description: >
      One entry per BPMN lane that maps to a generated agent. Map key is the role id (kebab-case,
      corresponds to sdlc:agentRole where that vocabulary applies).
    type: object
    additionalProperties:
      $ref: "#/definitions/role"
  elements:
    description: Map key is the BPMN element's own id attribute (task, gateway, event, data object, lane, ...).
    type: object
    minProperties: 1
    additionalProperties:
      $ref: "#/definitions/element"
  artifacts:
    description: >
      One entry per data-object / artifact TYPE (not per instance/version). Map key is the artifact
      type id referenced by elements.*.inputs[].artifact / outputs[].artifact.
    type: object
    additionalProperties:
      $ref: "#/definitions/artifact"
  contextSources:
    description: >
      One entry per durable data store the diagram draws (bpmn:dataStoreReference): knowledge to
      ground steps (wissen), a live system read/written at run time (live), or a curated memory file
      carried across runs (gedaechtnis). Map key is a kebab-case store id. Deliberately separate from
      `artifacts`: artifacts live for one run, stores outlive it and have different fields. Absent in
      specs of diagrams without data stores.
    type: object
    additionalProperties:
      $ref: "#/definitions/contextSource"
  workflowIO:
    $ref: "#/definitions/workflowIO"
  pattern:
    $ref: "#/definitions/pattern"
  knowledge:
    $ref: "#/definitions/knowledge"
  openQuestions:
    type: array
    items:
      $ref: "#/definitions/openQuestion"

definitions:
  meta:
    type: object
    required: [workflowName, sourceBpmn, language, generatorVersion, created, updated]
    additionalProperties: false
    properties:
      workflowName:
        type: string
        description: kebab-case; also the <workflow> segment of generated/<workflow>/.
      sourceBpmn:
        type: object
        required: [path, sha256]
        additionalProperties: false
        properties:
          path:
            type: string
            description: Repo-relative path to the author's .bpmn. Never rewritten by the generator.
          sha256:
            type: string
            pattern: "^[a-f0-9]{64}$"
            description: Hash of the .bpmn at analyze time; a mismatch on re-run means "elements may have changed" and drives the diff-only re-interview.
      language:
        type: string
        description: Language of the BPMN labels and business-facing content (e.g. "de"). Generated SKILL.md/agent prose stays English regardless (see mapping-rubric.md).
      generatorVersion:
        type: string
        description: semver of the bpmn2agent-* skill family that produced this spec.
      outputLayout:
        type: string
        enum: [claude-dir, legacy]
        description: >
          Where generate puts the files a user installs. claude-dir (every new spec): everything
          under generated/<workflow>/.claude/ in the exact layout of a project's .claude/ folder
          (skills/, agents/, hooks/, workflows/, one settings.json), so installing is a single copy.
          legacy (the default when absent, older specs such as the dark-factory example): skills/,
          agents/, hooks/*.hook.settings.json snippets and <workflow>.workflow.mjs directly under
          generated/<workflow>/.
      created:
        type: string
        format: date-time
      updated:
        type: string
        format: date-time

  role:
    type: object
    required: [bpmnLaneId, label, agentName]
    additionalProperties: false
    properties:
      bpmnLaneId:
        type: string
        description: id of the bpmn:lane this role was derived from.
      label:
        type: string
        description: Verbatim lane name from the BPMN (kept in the source language).
      agentName:
        type: string
        description: kebab-case name of the generated subagent (see .agents/skills/new-agent/agent-template.md naming convention).
      modelTier:
        enum: [haiku, sonnet, opus]
        description: >
          Optional. Unset by default — model choice is deployment config, not baked into the BPMN
          (mirrors sdlc:modelRole staying a role, not a model name). Only set when the mapping rubric
          or the user explicitly calls for a specific tier.
      tools:
        type: array
        items: { type: string }
        description: Optional tool allowlist for the generated agent's frontmatter; omit to inherit everything.
      notebooks:
        type: array
        items: { type: string }
        description: Notebook ids (knowledge.notebooks[].id) primarily grounding this role's steps.

  element:
    type: object
    required: [bpmnType, kind]
    additionalProperties: false
    properties:
      bpmnType:
        type: string
        description: >
          BPMN element type, e.g. task/userTask/manualTask/serviceTask/scriptTask/businessRuleTask/
          callActivity/subProcess/exclusiveGateway/parallelGateway/inclusiveGateway/startEvent/
          endEvent/boundaryEvent/dataObjectReference/dataStoreReference/dataInput/dataOutput/lane. See mapping-rubric.md for the v1
          supported/unsupported construct list.
      label:
        type: string
        description: Verbatim BPMN name, kept in the source language even though generated code/docs are English.
      lane:
        type: string
        description: Role id (key into `roles`) this element's lane maps to, if any.
      kind:
        enum:
          - agent-checklist
          - skill
          - script
          - hook
          - orchestrator
          - human-checkpoint
          - artifact-contract
          - context-source
          - workflow-input
          - workflow-output
          - not-generated
          - unresolved
        description: >
          Generation decision for this element. See mapping-rubric.md for how each is chosen.
          context-source = a dataStoreReference (its details live in `contextSources.<id>`);
          workflow-input / workflow-output = the process-wide input/output (details in `workflowIO`).
          None of the three has a generated file of its own.
      generatedPaths:
        type: array
        items: { type: string }
        description: >
          Repo-relative paths (under generated/<workflow>/, and under generated/<workflow>/.claude/
          for meta.outputLayout claude-dir) of files produced for this element: a skill directory,
          a script file, a hook script, or the anchor of an agent-checklist section. Empty or
          absent when kind is not-generated or unresolved.
      reason:
        type: string
        description: Required when kind is not-generated or unresolved — why, and what a human should do about it. Surfaces verbatim in the mapping report and as the grey/red annotation in the mapped BPMN.
      inputs:
        type: array
        items: { $ref: "#/definitions/artifactRef" }
      outputs:
        type: array
        items: { $ref: "#/definitions/artifactRef" }
      gate:
        $ref: "#/definitions/gate"
      condition:
        type: string
        description: Free-text condition on an outgoing sequence flow from a gateway, evaluated by whichever pattern was chosen (script, hook, or orchestrator agent) — never an executable BPMN conditionExpression.
      collection:
        $ref: "#/definitions/collection"
      knowledge:
        type: array
        items: { type: string }
        description: References into knowledge.notebooks[].id, or the literal "websearch" / "model-only" (unverified).
    allOf:
      - if:
          properties: { kind: { const: not-generated } }
        then:
          required: [reason]
      - if:
          properties: { kind: { const: unresolved } }
        then:
          required: [reason]

  artifactRef:
    type: object
    required: [artifact]
    additionalProperties: false
    properties:
      artifact:
        type: string
        description: Artifact type id; key into the top-level `artifacts` map.
      required:
        type: boolean
        description: Only meaningful on an input.
      itemPrefix:
        type: string
        description: Only meaningful on an output — short uppercase prefix for items this artifact produces (e.g. "VIS", "ST").
      cardinality:
        enum: [one, many]
        default: one
        description: Use "many" for e.g. one artifact instance per multi-instance loop iteration.

  gate:
    type: object
    required: [kind]
    additionalProperties: false
    properties:
      kind:
        enum: [critic, human, deterministic, panel]
        description: >
          critic = an independent LLM judge scores against a rubric; human = AskUserQuestion
          checkpoint; deterministic = a script evaluates a hard rule; panel = multiple independent
          judges/perspectives aggregated (dark-factory's phase-panel generalised).
      criteria:
        type: array
        items: { type: string }
        description: Plain-language pass criteria; the rubric/checklist content itself lives in the generated skill's references, not here.
      maxLoops:
        type: integer
        minimum: 0
        description: Loop cap before the gate stops sending work back and proceeds with a risk flag instead (see pattern-rubric.md for how each pattern enforces this).

  collection:
    type: object
    required: [ref]
    additionalProperties: false
    properties:
      ref:
        type: string
        description: Multi-instance collection expression, e.g. "epics[slice=1]" or "stories[status=needs-rework]".

  artifact:
    type: object
    required: [pathPattern]
    additionalProperties: false
    properties:
      pathPattern:
        type: string
        description: Path template under generated/<workflow>/ or the run workspace, e.g. "artifacts/{step}_{type}.md".
      frontmatter:
        type: array
        items:
          type: object
          required: [field]
          additionalProperties: false
          properties:
            field: { type: string }
            description: { type: string }
            required: { type: boolean, default: false }
      producer:
        oneOf:
          - type: string
          - type: array
            items: { type: string }
            minItems: 1
        description: >
          Element id(s) (key(s) into `elements`) that produce this artifact type — a single string
          for the common case, or an array when the diagram genuinely has more than one producer
          (e.g. a draft written by one element, then overwritten/confirmed by another with a real
          dataOutputAssociation of its own — see the artifact's `status` frontmatter field for how
          a consumer tells draft from confirmed).
      consumers:
        type: array
        items: { type: string }
        description: Element ids that declare this artifact type as an input.
      bundledIn:
        type: array
        items: { type: string }
        description: Ids of higher-level bundle artifacts this one rolls up into (sdlc:bundle equivalent), if any.

  contextSource:
    type: object
    required: [name, bpmnElement, art, quelle]
    additionalProperties: false
    properties:
      name:
        type: string
        description: Verbatim data store label from the BPMN (a business data set such as "Jira-Tickets Projekt LANE", not a system).
      bpmnElement:
        type: string
        description: id of the bpmn:dataStoreReference; also the key into `elements` (kind context-source).
      art:
        enum: [wissen, live, gedaechtnis]
        description: >
          wissen = reference knowledge loaded at generation time into knowledge/<taskId>.md; live = a
          system read (and maybe written) at run time through tools; gedaechtnis = a curated memory
          file read at the start and written at the end of a run. Valid Art x Quelle combinations are
          in mapping-rubric.md.
      quelle:
        type: object
        required: [type]
        additionalProperties: false
        properties:
          type:
            enum: [notebook, mcp, cli, url, datei, websearch]
          ref:
            type: string
            description: >
              notebook title, MCP server name, CLI command, URL or file path, as written after the
              prefix of the diagram's "Quelle:" line. Omitted for websearch.
      readers:
        type: array
        items: { type: string }
        description: Element ids of tasks with a data input association from this store (store -> task = read).
      writers:
        type: array
        items: { type: string }
        description: Element ids of tasks with a data output association to this store (task -> store = write).
      tools:
        description: >
          Only for art: live. Tools the readers/writers use, resolved by bpmn2agent-design (MCP tool
          names, Bash(<cmd> <subcmd>:*) patterns, WebFetch, Read) and split by read vs. write; unclear
          counts as write. The literal "unresolved" means the source could not be resolved (e.g. MCP
          server not connected): verify warns, generate emits no tools for it (never a wildcard).
        oneOf:
          - type: object
            additionalProperties: false
            properties:
              read:
                type: array
                items: { type: string }
              write:
                type: array
                items: { type: string }
          - const: unresolved
      memory:
        type: object
        required: [path]
        additionalProperties: false
        description: "Only for art: gedaechtnis."
        properties:
          path:
            type: string
            description: >
              Memory file relative to the run's cwd; default .claude/memory/<workflow>/<store>.md,
              overridden by the diagram's "Quelle: datei:<path>".
          maxLines:
            type: integer
            minimum: 1
            default: 150
            description: Line cap enforced by a PostToolUse hook (exit 2 asks Claude to condense).
    allOf:
      - if:
          properties: { art: { const: wissen } }
        then:
          properties:
            quelle:
              properties:
                type: { enum: [notebook, mcp, url, datei, websearch] }
            tools: false
            memory: false
      - if:
          properties: { art: { const: live } }
        then:
          properties:
            quelle:
              properties:
                type: { enum: [notebook, mcp, cli, url, datei] }
            memory: false
      - if:
          properties: { art: { const: gedaechtnis } }
        then:
          properties:
            quelle:
              properties:
                type: { const: datei }
            tools: false

  workflowIO:
    type: object
    additionalProperties: false
    description: >
      Process-wide input and output: a real ioSpecification dataInput/dataOutput, or by convention a
      data object nobody produces (input) / nobody reads (output). Both become artifact contracts;
      the orchestrator derives its argument-hint from the input's required fields.
    properties:
      input:
        type: object
        required: [artifact]
        additionalProperties: false
        properties:
          artifact:
            type: string
            description: Artifact type id; key into the top-level `artifacts` map.
          required:
            type: array
            items: { type: string }
            description: Frontmatter fields the orchestrator must have before starting; it asks when one is missing.
      output:
        type: object
        required: [artifact]
        additionalProperties: false
        properties:
          artifact:
            type: string
            description: Artifact type id; the contract for the final result.

  pattern:
    type: object
    required: [chosen, rationale]
    additionalProperties: false
    properties:
      chosen:
        enum: [skill-chain-hooks, workflow-script, orchestrator-agent, mixed]
        description: See pattern-rubric.md for the decision table.
      rationale:
        type: string
        description: Plain-language explanation, phrased the way it was put to the business user for confirmation.
      alternativesConsidered:
        type: array
        items:
          type: object
          required: [pattern, whyNot]
          additionalProperties: false
          properties:
            pattern:
              enum: [skill-chain-hooks, workflow-script, orchestrator-agent, mixed]
            whyNot: { type: string }
      phases:
        type: array
        description: >
          Only meaningful (and only ever populated) when chosen: mixed — the explicit phase
          boundaries pattern-rubric.md's "Mixed" section otherwise leaves to inference from
          contiguous element runs (bpmn2agent-generate SKILL.md step 7's own "mixed" caveat). One
          entry per phase, in diagram order; every element id must appear in exactly one phase's
          `elements`.
        items:
          type: object
          required: [name, pattern, elements]
          additionalProperties: false
          properties:
            name:
              type: string
              description: Short, business-facing phase name (the user's language), e.g. "Recherche" / "Freigabe".
            pattern:
              enum: [skill-chain-hooks, workflow-script, orchestrator-agent]
              description: This phase's own pattern — never "mixed" again at the phase level.
            elements:
              type: array
              items: { type: string }
              minItems: 1
              description: Element ids belonging to this phase, in diagram order.

  knowledge:
    type: object
    additionalProperties: false
    properties:
      notebooks:
        type: array
        items:
          type: object
          required: [id, title, mappedTo]
          additionalProperties: false
          properties:
            id: { type: string, description: Notebook id/URL. }
            title: { type: string }
            mappedTo:
              type: array
              items: { type: string }
              description: Element ids and/or role ids this notebook grounds.
      mode:
        enum: [notebook, websearch, local-docs, unverified]
        description: >
          Fallback mode actually used when no notebook was mapped (or overall, if none were mapped
          at all) — WebSearch research (cited), an existing, already-reviewed reference file living
          in this same repo ("local-docs" — see `refs`, and
          `bpmn2agent-knowledge/references/notebook-extraction.md`'s local-docs citation section),
          or model-only knowledge explicitly marked "unverified". "notebook" means every element had
          notebook coverage, no fallback needed. Written by bpmn2agent-knowledge; bpmn2agent-design
          reads it to fill each element's `knowledge` array (see mapping-rubric.md) when no more
          specific notebook/ref applies.
      refs:
        type: object
        additionalProperties: { type: string }
        description: >
          Map of element id or lane/role id -> repo-relative path of the knowledge file grounding
          it. Usually the distilled, cited file bpmn2agent-knowledge extracted
          (generated/<workflow>/knowledge/*.md) — mode: notebook/websearch/unverified. Under mode:
          local-docs, may instead point directly at an existing, already-reviewed repo file (no
          extraction/distillation step) — see
          bpmn2agent-knowledge/references/notebook-extraction.md's local-docs section.

  openQuestion:
    type: object
    required: [elementId, question]
    additionalProperties: false
    properties:
      elementId: { type: string }
      question: { type: string }
      source:
        type: string
        description: Where the question came from — a notebook title, "WebSearch", or omitted for a plain analysis-time gap.
      answer:
        type: [string, "null"]
        default: null
      answeredAt:
        type: [string, "null"]
        format: date-time
        default: null
