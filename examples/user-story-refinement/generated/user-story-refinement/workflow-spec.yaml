      - generated/user-story-refinement/knowledge/E4.md
      - generated/user-story-refinement/knowledge/phase-6-plausibilitaet-freigabe.md
    gate:
      kind: human
      criteria:
        - 'Position in the backlog confirmed by the PO (WSJF suggestion: Cost of Delay asked here / story points)'
        - Priority is stored as the GitHub project field "Priority"; Status becomes "Ready"
        - Change proposals for affected stories approved or rejected one by one
        - Shows the exact backlog changes before approval (repo and project, issue title and body, label epic:<name>, Status, Priority, the notes for affected stories) and how many Claude Code write prompts follow; the PO approves, edits or rejects
        - Records the decision in run-state checkpoints.E4 (decision, priority, approvedVersions of the shown artifacts, approvedAt) and the per-proposal decision in aenderungsvorschlaege; the write steps refuse to write when an artifact version differs from approvedVersions
        - Not approved → nothing is written; the run pauses here with the reason in run-state and resumes from the story folder
