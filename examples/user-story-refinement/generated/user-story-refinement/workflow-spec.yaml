    answer: >-
      Yes. All three backlog stores are the same GitHub backlog (one DataStore_Backlog); the plausibility checks read it through "Product Backlog: übrige Stories", and the writers look up existing items with the read tools listed on this store. Decided in design.
    answeredAt: '2026-10-04T11:48:16.000Z'
  - elementId: StoreRef_BacklogFreigabe
    question: >-
      How does the write-guard hook recognise a gh write, and does it pin the repo?
    source: 'bpmn2agent-design'
    answer: >-
      The hook splits the Bash command on shell operators (;, &&, ||, |, newline, $( ), backticks), finds gh in every segment (also after env assignments, env, command, a path ending in /gh, or inside bash -c / sh -c) and answers "ask" unless every segment matches a listed read pattern; unparseable counts as write. It does not pin repo or project: the skill text pins -R/--repo and the approvals show the target repo. Accepted risk: a write to another repo is caught only by the ask prompt.
    answeredAt: '2026-10-04T11:51:34.000Z'
