    frontmatter:
      - field: storyId
        required: true
      - field: version
        required: true
      - field: status
        required: true
      - field: epic
        required: true
      - field: storyPoints
        required: true
      - field: priority
        required: true
      - field: backlogItem
        required: true
        description: URL of the GitHub issue that holds the story in the product backlog. Written right after the issue is created, before it is added to the project, so a resumed run reuses it instead of creating a second issue.
  dor-befund:
    pathPattern: stories/{storyId}/07_dor-befund.md
    frontmatter:
      - field: storyId
        required: true
      - field: version
        required: true
      - field: status
        required: true
    producer:
      - E1
      - E2
      - E3
    consumers:
      - Gw_Ready
  aenderungsvorschlaege:
    pathPattern: stories/{storyId}/09_aenderungsvorschlaege.md
    frontmatter:
      - field: storyId
        required: true
      - field: status
        required: true
      - field: proposals
        required: true
        description: >-
          One entry per proposed change: target issue URL, the exact change (a comment, or a diff against the body read
          at approval), baseUpdatedAt of the target issue, decision (approved / rejected), appliedUrl. The write step
          re-reads the issue first and stops to ask again when updatedAt changed; it adds (comments, appended sections)
          instead of rewriting a body, writes appliedUrl right after each gh call and skips entries that already have
          one. The run reaches its end event only when every approved entry is applied or explicitly skipped.
    producer:
      - P5
      - P9
      - E4
    consumers:
      - E4
      - P6
      - P10
  uebergabe:
    pathPattern: stories/{storyId}/99_uebergabe.md
    frontmatter:
      - field: storyId
        required: true
      - field: status
        required: true
      - field: target
        required: true
      - field: backlogItem
        required: false
        description: URL of the GitHub comment or issue written after approval ("Änderungshinweis an offener Story ergänzen", "Feedback im Opportunity Backlog anlegen"). Written right after the gh call; before writing, the step checks this field and searches the target for the storyId marker, so a resumed run never writes twice.
    producer:
      - I3
      - I5
      - End_BugUebergeben
      - End_AnStoryUebergeben
      - End_FeedbackGeparkt
      - End_FachkonzeptAenderung
      - End_AnliegenVerworfen
      - End_StoryVerworfen
      - End_StoryZusammengefuehrt
    consumers:
      - I4
      - I6
  run-state:
    pathPattern: stories/{storyId}/00_run.md
    frontmatter:
      - field: storyId
        required: true
      - field: parentStory
        required: false
      - field: position
        required: true
      - field: checkpoints
        required: true
      - field: loops
        required: true
      - field: status
        required: true
    producer:
      - Start_FeedbackEingegangen
      - D6
      - I3
      - I5
      - P9
      - E4
    consumers:
      - I4
      - I6
      - P6
      - P8
      - P10
      - K1
      - B5
      - D1
      - D5
      - E4
      - Gw_Invest
      - Gw_Schaetzung
      - Gw_Sprintgroesse
      - Gw_Ready
      - Gw_Plausibel
  feedback:
    pathPattern: '{feedback} (feedback text or file the user hands over at the start, read-only)'
    frontmatter:
      - field: feedback
        required: true
        description: The raw user or stakeholder feedback, as text or a path to a file.
      - field: backlog
        required: true
        description: GitHub repository and project of the product backlog and user story map, e.g. "owner/repo, project 3". Epics are labels epic:<name>; Status "Ready" and the field "Priority" live in the project. Read and written with gh.
      - field: fachkonzept
        required: true
        description: Location of the existing epic and Fachkonzept documents.
    consumers:
      - I1
