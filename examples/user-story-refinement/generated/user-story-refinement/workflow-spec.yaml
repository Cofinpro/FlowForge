openQuestions:
  - elementId: Gw_Fachkonzept
    question: >-
      The sources treat a conflict with the Fachkonzept as a trigger to refine model and language with the domain
      experts, not a hard stop. Keep the end event "Fachkonzept-Änderung beantragt" or loop back?
    source: 'NotebookLM: The Product - Business Design [triage-klaerung-1: 7, 9, 10, 11]'
    answer: >-
      Keep the diagram as drawn. The change request names the conflicting term or rule and a proposal so it involves the
      domain experts concretely.
    answeredAt: '2026-09-26T10:11:53.539Z'
  - elementId: K4
    question: >-
      Non-functional requirements (performance, security, capacity) are not checked explicitly anywhere. Where should
      they go?
    source: 'NotebookLM: The Product - Business Design [triage-klaerung-1: 23, 24, 25, 26]'
    answer: >-
      Into existing steps: "Technische Auswirkungen grob einschätzen" and the Definition-of-Ready checklist. No new BPMN
      step.
    answeredAt: '2026-09-26T10:11:53.539Z'
  - elementId: K3
    question: Should the steps require a measurable target (expected behaviour change and metric) for every story?
    source: 'NotebookLM: The Product - Business Design [triage-klaerung-1: 16, 17, 18]'
    answer: >-
      Yes: "Ist-/Soll-Delta beschreiben" and "Story im Connextra-Format formulieren" ask for the expected behaviour
      change and a metric. No new step.
    answeredAt: '2026-09-26T10:11:53.539Z'
  - elementId: E4
    question: Should "Story priorisieren & in Ready-Spalte stellen" suggest a prioritisation method?
    source: 'NotebookLM: The Product - Business Design [backlog-plausibilitaet-1: 33-40]'
    answer: 'Yes: suggest a position via Weighted Shortest Job First (Cost of Delay ÷ story points); the PO decides.'
    answeredAt: '2026-09-26T10:11:53.539Z'
  - elementId: P6
    question: >-
      The merge path (Gw_Plausibel -> "Mit bestehender Story zusammenführen" -> end) passes no human approval. Add a
      userTask to the BPMN or confirm inside the flow?
    source: 'agentic-workflow-architect review [human-in-the-loop-1: 8, 9, 10, 28]'
    answer: Confirm inside the flow before the end event; the workflow only writes a merge proposal. No BPMN change.
    answeredAt: '2026-09-26T10:26:14.274Z'
  - elementId: D6
    question: >-
      A vertical split yields several part stories. Continue with the first and keep the rest as drafts, or process all
      of them one after another?
    source: agentic-workflow-architect review
    answer: >-
      Process all part stories one after another in the same run (stories/{storyId}-1, -2, ...), each through the rest
      of the flow.
    answeredAt: '2026-09-26T10:26:14.276Z'
