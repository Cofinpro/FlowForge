pattern:
  chosen: skill-chain-hooks
  rationale: >-
    Dein Diagramm wird von einem Menschen begleitet: achtmal entscheidet oder bestätigt jemand aus dem Team. Einige
    Verzweigungen verlangen ein Urteil (Bug oder Story? passt es zum Fachkonzept? tragen die Erkenntnisse?). Diese
    Urteile schlage ich mit Begründung vor, und du bestätigst jeden Ausgang und jeden Rücksprung – so bleibt die
    Entscheidung bei euch. Ich baue es deshalb als geführten Ablauf: ein Einstiegs-Skill geht die sechs Phasen der Reihe
    nach durch, ruft je Phase einen Skill mit den Checklisten aus dem Notebook auf und hält an euren Prüfpunkten an.
    Parallele Blöcke arbeitet er als getrennte Perspektiven nacheinander ab, jede schreibt zuerst ihren eigenen
    Abschnitt. Schleifen haben feste Obergrenzen; bei Definition of Ready, Backlog-Konsistenz und Sprintgröße fragt er
    dich an der Grenze, statt einfach weiterzumachen. Ins GitHub-Backlog schreibt der Ablauf nur an fünf Stellen, und
    jedes Mal erst nach deiner Freigabe direkt davor: Änderungshinweis an eine offene Story, Eintrag im Opportunity
    Backlog, Zusammenführung mit einem Duplikat, die neue Story in der Ready-Spalte und die Hinweise an betroffenen
    Stories. Alle Schreibschritte liegen in einem eigenen Skill, der ohne Freigabe nicht schreibt; Claude Code fragt
    beim Schreiben zusätzlich nach. Gelesen wird das Backlog von vier Schritten; der Lesezugriff ist nicht pro Rolle
    getrennt. Ein koordinierender Agent könnte jeder Rolle nur ihren Zugriff geben (UX & Design keinen, Entwicklung und
    QA nur lesen); das lohnt sich, wenn euch diese Trennung wichtig ist.
  alternativesConsidered:
    - pattern: orchestrator-agent
      whyNot: >-
        Six gateways need judgement (Gw_Bug, Gw_Bezug, Gw_Fachkonzept, Gw_Erkenntnis, Gw_Ready, Gw_Plausibel), which
        points to the orchestrator row. Every exit and loop-back of these is confirmed by the user instead, so a person
        makes the call, as with a gateway right after a checkpoint. A coordinator agent plus one agent per lane and its
        own run-state file would add independence for the parallel checks, but the business user chose the lighter
        guided flow. With the GitHub backlog the roles need different access (UX & Design none, Entwicklung and QA read
        only, only Product Owner / BA writes); only a coordinator with one agent per lane could separate that. Not
        chosen: every write sits behind its own approval, in one write skill, and behind the write-guard hook.
    - pattern: workflow-script
      whyNot: >-
        The flow pauses eight times for people (clarification, evaluation, refinement meeting, planning poker, three
        approvals before backlog writes, prioritisation) and writes into a live store; a Workflow script cannot stop for
        them mid-run.
