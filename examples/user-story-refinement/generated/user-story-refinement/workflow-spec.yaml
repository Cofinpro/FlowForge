        - Asked together with the confirmation of the Gw_Plausibel duplicate verdict (one question, both decisions recorded separately)
        - Records the approved diff and the duplicate's updatedAt in aenderungsvorschlaege and run-state checkpoints.P9
        - Not approved → nothing is written; the run pauses here with the reason in run-state and resumes from the story folder
