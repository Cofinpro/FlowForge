pattern:
  chosen: workflow-script
  rationale: >-
    Dein Prozess läuft vollständig ohne Menschen, hat echte Parallelität (drei Recherche-Kanäle, Kritiker und Panel
    gleichzeitig) und Mehrfach-Instanzen („je Epic“, „je Story“, „je Persona“). Jede Raute routet nur auf dem Verdikt
    eines Gate-Records (pass / fail / pivot / more-research / no-go) — das eigentliche Urteil fällt vorher im
    Kritiker-Schritt. Deshalb baue ich das als automatisches Workflow-Skript, das jeden Schritt vom Agenten seiner Rolle
    ausführen lässt. Es läuft nur, wenn du es pro Idee bewusst startest; nichts passiert im Hintergrund.
  alternativesConsidered:
    - pattern: orchestrator-agent
      whyNot: >-
        Die Gateways brauchen kein Einzelfall-Urteil (sie lesen nur das Verdikt des Kritikers), und ein einzelner
        Agent-Kontext kann ~60 Schritte mit Schleifen, Pivots und Mehrfach-Instanzen weder halten noch die Loop-Caps
        deterministisch einhalten.
    - pattern: skill-chain-hooks
      whyNot: >-
        Es gibt keinen menschlichen Prüfpunkt, an dem jemand die Kette weiterschiebt; die Parallelität (Recherche,
        Phasen-Gates) und die „je Epic / je Story“-Schleifen bräuchten ohnehin eine Steuerung.
    - pattern: mixed
      whyNot: >-
        Alle Phasen haben dieselbe Form (unbeaufsichtigt, deterministisches Routing auf Gate-Records) — es gibt keinen
        strukturell anderen Abschnitt, der ein zweites Muster rechtfertigt.
