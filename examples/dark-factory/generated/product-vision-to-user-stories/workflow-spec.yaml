    question: >-
      Das Event-Sub-Prozess „Budget erschoepft“ kann jeden Schritt unterbrechen — das kann v1 nicht generieren. Diagramm
      ändern oder als Budget-Check akzeptieren?
    answer: >-
      Akzeptiert als Budget-Check: Workflow prüft vor jedem Schritt das Token-Budget, bei Erschöpfung Teilergebnis +
      Run-Report (status: partial); Deep-Research-Hard-Cap per Hook.
    answeredAt: '2026-09-25T18:00:00Z'
