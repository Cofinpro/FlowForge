          1.1.2_vision-statement
        required: true
      - field: type
        description: '[sidecar, computed by script] Artifact type id (Gedächtnis §11.1)'
        required: true
      - field: bpmnElement
        description: '[sidecar, computed by script] Producing BPMN element id'
        required: true
      - field: runId
        description: '[sidecar, computed by script] Run workspace id'
        required: true
      - field: version
        description: >-
          [sidecar, computed by script] Bumped on every commit with a changed body/authored block (Gedächtnis §15);
          snapshots in history/<id>/
        required: true
      - field: status
        description: >-
          [sidecar, computed by script] draft on every commit; passed | passed-with-risk | discarded only via
          write-gate-record.mjs
        required: true
      - field: producedBy
        description: '[sidecar, computed by script] {agentRole, modelRole, model, skill} from the step contract'
        required: true
      - field: derivedFrom
