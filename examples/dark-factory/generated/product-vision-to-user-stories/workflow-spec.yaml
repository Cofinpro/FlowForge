      Validierungs-Check — fehlt im BPMN.
    source: The Product - Business Design
    answer: >-
      Übernommen als Leitfaden-/Rubric-Kriterium in 2.1.2/2.1.4 und phase-2-1; Kernproblem nicht unter Top 3 =
      Kill-Signal für G-P2. Kein BPMN-Umbau.
    answeredAt: '2026-09-25T18:00:00Z'
